services:
  extract:
    build: .
    env_file:
      - .env
    environment:
      - PROJECTS_CONFIG=/config/projects.json
    volumes:
      - ${WORKSPACE_PATH:-.}:/workspace:ro
      - ${PROJECTS_CONFIG_PATH:-./projects.example.json}:/config/projects.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  schema-extract:
    profiles: ["mongo"]
    build: ./mongodb
    env_file:
      - .env

  # neo4j service remains commented out
