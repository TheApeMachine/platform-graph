  #     - NEO4J_PLUGINS=["apoc", "graph-data-science", "apoc-extended", "bloom"]
  #   volumes:
  #     - neo4j_data:/data
  #     - neo4j_logs:/logs
  #     - /home/theapemachine/data:/var/lib/neo4j/import
  #     - neo4j_plugins:/plugins
